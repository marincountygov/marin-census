<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- BEGIN generated security meta: python3 scripts/sync-security-meta.py --write -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://marincountygov.github.io/marin-os/catalog.json https://marincountygov.github.io/marin-os/data/lighthouse.json https://marincountygov.github.io/marin-os/data/tech.json https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- END generated security meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marin Census | County of Marin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23000'/%3E%3Cg fill='none' stroke='%23e5b53b' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(9,9) scale(1.25)'%3E%3Cpath d='M18 21a8 8 0 0 0-16 0'/%3E%3Ccircle cx='10' cy='8' r='5'/%3E%3Cpath d='M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="description" content="Public statistics about Marin's people, communities and housing.">
    <link rel="stylesheet" href="vendor/marinos/marinos.css">
    <link rel="stylesheet" href="assets/app.css">
    <script src="assets/gate.js"></script>
    <script src="vendor/marinos/marinos.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <noscript>
      <div class="container app-alert app-alert--warning">
        JavaScript is required to display the MarinOS interface and use this application.
      </div>
    </noscript>

    <marin-os-banner></marin-os-banner>

    <marin-app-header app-name="Marin Census" app-description="Public statistics about Marin's people, communities and housing.">
      <template data-icon>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 21a8 8 0 0 0-16 0"/>
          <circle cx="10" cy="8" r="5"/>
          <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/>
        </svg>
      </template>
    </marin-app-header>

    <main id="main" class="container app-main">
      <!-- Keep the primary workflow first; the shell uses it as the default view. -->
      <section id="start" class="app-page-heading" data-tab-section="start" aria-labelledby="start-heading">
        <h2 id="start-heading">Marin Census</h2>
        <p>Marin Census is in development.</p>
      </section>

      <!-- Supply app-owned content only; the shell generates sections and headings. -->
      <marin-app-info app-name="Marin Census" repo="marin-census" security-src="security.json">
        <template data-about>
          <p>Marin Census will help County staff understand Marin's people, communities, housing and economy using public data. It is an alpha: the statistics are still being prepared and are not shown yet.</p>
        </template>
        <template data-accessibility>
          <p>This alpha has not had an accessibility review. Use the feedback form to report a problem.</p>
        </template>
      </marin-app-info>
    </main>

    <marin-app-footer app-name="Marin Census"></marin-app-footer>
    <marin-app-feedback></marin-app-feedback>
  </body>
</html>
